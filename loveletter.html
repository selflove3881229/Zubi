  <script>
    const music = document.getElementById("bgMusic");
    const btn = document.getElementById("musicBtn");
    let isPlaying = false;

    btn.addEventListener("click", () => {
      if (!isPlaying) {
        music.play().then(() => {
          isPlaying = true;
          btn.textContent = "⏸ Pause Music";
        }).catch(err => {
          console.log("Music play blocked:", err);
        });
      } else {
        music.pause();
        isPlaying = false;
        btn.textContent = "▶️ Play Music";
      }
    });

    // Floating hearts animation
    function createHeart() {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      heart.style.animationDuration = (Math.random() * 3 + 3) + "s";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }
    setInterval(createHeart, 700);
    
      // 🌸 Days + Hours + Minutes + Seconds since website started
const startDate = new Date("2026-09-01T23:59:00"); // YYYY-MM-DDTHH:MM:SS

function updateTimer() {
  const now = new Date();
  const diff = now - startDate;

  if (diff < 0) {
    document.getElementById("timer").textContent = "⏳ Countdown अभी बाकी है...";
    return;
  }

  const days = Math.floor(diff / (1000 * 60 * 60 * 24));
  const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
  const minutes = Math.floor((diff / (1000 * 60)) % 60);
  const seconds = Math.floor((diff / 1000) % 60);

  document.getElementById("timer").textContent =
    "🌸 हमारी वेबसाइट को बने हुए " +
    days + " दिन " +
    hours + " घंटे " +
    minutes + " मिनट " +
    seconds + " सेकंड ❤️";
}

setInterval(updateTimer, 1000);
updateTimer();
  </script>
